services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: biblioteca
    ports: ["3306:3306"]
    volumes:
      - ./dbf:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DB_HOST: db
    volumes:
      - ./src:/app
    depends_on:
      db:
        condition: service_healthy
